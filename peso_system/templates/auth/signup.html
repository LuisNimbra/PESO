<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sign up &mdash; PESO CSJDM Job Recommendation System</title>
  <link rel="icon" type="image/png" href="{{ url_for('static', filename='img/peso_logo.png') }}" />
  <script>
  (function(){try{if(localStorage.getItem('peso-theme')==='dark'){var r=document.documentElement;r.setAttribute('data-theme','dark');r.setAttribute('data-bs-theme','dark');r.setAttribute('data-coreui-theme','dark');}}catch(e){}})();
  </script>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@coreui/coreui@5/dist/css/coreui.min.css" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" />
  <link rel="stylesheet" href="{{ url_for('static', filename='css/custom.css') }}" />
</head>
<body class="login-body d-flex align-items-center justify-content-center">

<div style="position:fixed;top:1.25rem;right:1.25rem;display:flex;gap:.5rem;align-items:center;z-index:1030;">
  <a href="{{ url_for('index') }}" class="icon-fab icon-fab-inverse"
     aria-label="Home" title="Home">
    <i class="bi bi-house-door-fill"></i>
  </a>
  <button type="button" class="theme-toggle-btn theme-toggle-btn-inverse"
          aria-label="Toggle dark mode" title="Toggle dark mode">
    <i class="bi bi-moon-stars-fill"></i>
  </button>
</div>

<div class="login-card card shadow-lg p-4" style="width:100%;max-width:440px;">
  <div class="text-center mb-4">
    <div class="login-icon mb-3">
      <img src="{{ url_for('static', filename='img/peso_logo.png') }}" alt="PESO CSJDM" />
    </div>
    <h4 class="fw-bold">PESO CSJDM</h4>
    <p class="text-muted small mb-0">Job Recommendation System</p>
    <p class="text-muted small">City of San Jose del Monte, Bulacan</p>
  </div>

  {% with messages = get_flashed_messages(with_categories=true) %}
    {% for category, message in messages %}
    <div class="alert alert-{{ category }} alert-dismissible fade show" role="alert">
      {{ message }}
      <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
    </div>
    {% endfor %}
  {% endwith %}

  <form method="POST" action="{{ url_for('register') }}">
    <div class="row g-2 mb-3">
      <div class="col-12 col-sm-6">
        <label class="form-label fw-semibold">First name</label>
        <div class="input-group">
          <span class="input-group-text"><i class="bi bi-person"></i></span>
          <input type="text" name="first_name" class="form-control" placeholder="First name"
                 value="{{ form.get('first_name','') }}" required autofocus maxlength="50" autocomplete="given-name" />
        </div>
      </div>
      <div class="col-12 col-sm-6">
        <label class="form-label fw-semibold">Last name / Surname</label>
        <div class="input-group">
          <span class="input-group-text"><i class="bi bi-person"></i></span>
          <input type="text" name="last_name" class="form-control" placeholder="Last name"
                 value="{{ form.get('last_name','') }}" required maxlength="50" autocomplete="family-name" />
        </div>
      </div>
    </div>
    <div class="mb-3">
      <label class="form-label fw-semibold">Email address</label>
      <div class="input-group">
        <span class="input-group-text"><i class="bi bi-envelope"></i></span>
        <input type="email" name="email" class="form-control" placeholder="Email address"
               value="{{ form.get('email','') }}" required autocomplete="email" maxlength="254" />
      </div>
    </div>
    <div class="mb-3">
      <label class="form-label fw-semibold">Confirm email address</label>
      <div class="input-group">
        <span class="input-group-text"><i class="bi bi-envelope-check"></i></span>
        <input type="email" name="confirm_email" class="form-control" placeholder="Re-enter your email"
               value="{{ form.get('confirm_email','') }}" required autocomplete="email" maxlength="254" onpaste="return false;" />
      </div>
    </div>
    <div class="mb-3">
      <label class="form-label fw-semibold">Password</label>
      <div class="input-group">
        <span class="input-group-text"><i class="bi bi-lock"></i></span>
        <input type="password" name="password" id="pw" class="form-control"
               placeholder="At least 8 characters" required minlength="8" maxlength="64" autocomplete="new-password" />
        <button type="button" class="btn btn-outline-secondary" onclick="togglePw()">
          <i class="bi bi-eye" id="pw-eye"></i>
        </button>
      </div>
    </div>

    <label class="form-label fw-semibold">I am a</label>
    <div class="row g-2 mb-4">
      <div class="col-6">
        <input type="radio" class="btn-check" name="role" id="role_js" value="jobseeker"
               {% if role == 'jobseeker' %}checked{% endif %} required />
        <label class="btn btn-sm btn-outline-primary w-100" for="role_js">
          <i class="bi bi-person-badge me-1"></i>Jobseeker
        </label>
      </div>
      <div class="col-6">
        <input type="radio" class="btn-check" name="role" id="role_emp" value="employer"
               {% if role == 'employer' %}checked{% endif %} required />
        <label class="btn btn-sm btn-outline-success w-100" for="role_emp">
          <i class="bi bi-building me-1"></i>Employer
        </label>
      </div>
    </div>

    <button type="submit" class="btn btn-primary w-100 fw-semibold">
      <i class="bi bi-person-plus me-1"></i> Create Account
    </button>
  </form>
</div>

<script src="https://cdn.jsdelivr.net/npm/@coreui/coreui@5/dist/js/coreui.bundle.min.js"></script>
<script src="{{ url_for('static', filename='js/theme.js') }}"></script>
<script src="{{ url_for('static', filename='js/forms.js') }}"></script>
<script>
  function togglePw() {
    const pw  = document.getElementById('pw');
    const eye = document.getElementById('pw-eye');
    if (pw.type === 'password') {
      pw.type = 'text';
      eye.className = 'bi bi-eye-slash';
    } else {
      pw.type = 'password';
      eye.className = 'bi bi-eye';
    }
  }
</script>
</body>
</html>
